[pytest]
# scripts/test_*.py are manual/network diagnostics invoked explicitly by
# dedicated GitHub Actions workflows, not hermetic pytest tests.
testpaths = tests
# The phase-era modules target the removed path-based SQLite Repository API.
# They remain in-tree as migration references but are not server regressions.
addopts = -m "not legacy_desktop"
markers =
    legacy_gui: PySide6 desktop GUI tests; skipped when the optional GUI runtime is unavailable
    legacy_desktop: archived tests for the retired SQLite/portable-desktop contracts, excluded from the server suite
