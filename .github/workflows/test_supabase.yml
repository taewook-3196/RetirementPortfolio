name: Test Supabase Connection

on:
  workflow_dispatch:

jobs:
  test-supabase:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_USER_ID: ${{ secrets.TEST_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test watchlist operations
        run: |
          python - <<'PY'
          import os
          import sys
          from uuid import UUID

          from database.connection import init_db
          from database.repository import Repository

          repo = None
          test_ticker = None
          added = False

          try:
              print("1. Testing database connection...")
              init_db()
              print("   SUCCESS: database connection works.")

              user_id_text = os.environ.get(
                  "TEST_USER_ID",
                  "",
              ).strip()

              if not user_id_text:
                  raise RuntimeError(
                      "TEST_USER_ID secret is missing."
                  )

              user_id = UUID(user_id_text)

              print("2. Creating user-scoped Repository...")

              repo = Repository(
                  user_id=str(user_id)
              )

              print("   SUCCESS: Repository created.")

              print("3. Finding test asset...")

              assets = repo.search_etf_master(
                  keyword="",
                  limit=10,
              )

              if not assets:
                  raise RuntimeError(
                      "asset_master is empty. "
                      "No asset is available for "
                      "the watchlist test."
                  )

              test_ticker = assets[0]["ticker"]
              test_name = assets[0]["name"]

              print(
                  f"   Test asset: "
                  f"{test_ticker} {test_name}"
              )

              # 이전 실패 테스트에서 같은 사용자의
              # 임시 관심종목이 남아 있을 가능성을 정리
              repo.remove_watchlist(
                  test_ticker
              )

              print("4. Adding watchlist item...")

              watch = repo.add_watchlist(
                  ticker=test_ticker,
                  memo="GitHub Actions test",
              )

              added = True

              if watch.ticker != test_ticker:
                  raise RuntimeError(
                      "Wrong ticker was saved."
                  )

              print(
                  "   SUCCESS: watchlist item added."
              )

              print("5. Reading watchlist...")

              watchlist = repo.get_watchlist()

              matches = [
                  item
                  for item in watchlist
                  if item["ticker"] == test_ticker
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      "Watchlist item could not be "
                      "read correctly."
                  )

              if matches[0]["memo"] != (
                  "GitHub Actions test"
              ):
                  raise RuntimeError(
                      "Watchlist memo was not "
                      "saved correctly."
                  )

              print(
                  "   SUCCESS: watchlist item read."
              )

              print("6. Updating watchlist memo...")

              updated = repo.update_watchlist_memo(
                  ticker=test_ticker,
                  memo="Updated test memo",
              )

              if not updated:
                  raise RuntimeError(
                      "Watchlist memo update failed."
                  )

              watchlist = repo.get_watchlist()

              matches = [
                  item
                  for item in watchlist
                  if item["ticker"] == test_ticker
              ]

              if (
                  len(matches) != 1
                  or matches[0]["memo"]
                  != "Updated test memo"
              ):
                  raise RuntimeError(
                      "Updated memo could not be "
                      "verified."
                  )

              print(
                  "   SUCCESS: watchlist memo updated."
              )

              print("7. Testing duplicate handling...")

              duplicate = repo.add_watchlist(
                  ticker=test_ticker,
                  memo="Duplicate test memo",
              )

              if duplicate.ticker != test_ticker:
                  raise RuntimeError(
                      "Duplicate handling returned "
                      "the wrong item."
                  )

              watchlist = repo.get_watchlist()

              matches = [
                  item
                  for item in watchlist
                  if item["ticker"] == test_ticker
              ]

              if len(matches) != 1:
                  raise RuntimeError(
                      "Duplicate watchlist row "
                      "was created."
                  )

              if matches[0]["memo"] != (
                  "Duplicate test memo"
              ):
                  raise RuntimeError(
                      "Duplicate add did not update "
                      "the existing memo."
                  )

              print(
                  "   SUCCESS: duplicate handled "
                  "without creating another row."
              )

              print("8. Removing watchlist item...")

              removed = repo.remove_watchlist(
                  test_ticker
              )

              if not removed:
                  raise RuntimeError(
                      "Watchlist removal failed."
                  )

              added = False

              print(
                  "   SUCCESS: watchlist item removed."
              )

              print("9. Verifying removal...")

              remaining = repo.get_watchlist()

              if any(
                  item["ticker"] == test_ticker
                  for item in remaining
              ):
                  raise RuntimeError(
                      "Watchlist item still exists "
                      "after removal."
                  )

              print(
                  "   SUCCESS: removal verified."
              )

              print("")
              print(
                  "SUCCESS: User watchlist operations "
                  "are working with Supabase."
              )

          except Exception as exc:
              print("")
              print(
                  "ERROR: Watchlist test failed."
              )
              print(
                  f"{type(exc).__name__}: {exc}"
              )

              if (
                  added
                  and repo is not None
                  and test_ticker
              ):
                  print(
                      "Attempting cleanup of temporary "
                      "watchlist item..."
                  )

                  try:
                      repo.remove_watchlist(
                          test_ticker
                      )
                      print("Cleanup completed.")
                  except Exception as cleanup_exc:
                      print(
                          "Cleanup failed: "
                          f"{type(cleanup_exc).__name__}: "
                          f"{cleanup_exc}"
                      )

              sys.exit(1)
          PY
