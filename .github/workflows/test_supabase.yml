name: Test Login Page

on:
  workflow_dispatch:

jobs:
  test-login-page:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test login page
        run: |
          python - <<'PY'
          import sys

          try:
              print("1. Importing web application...")

              from web.app import app, home

              print(
                  "   SUCCESS: web application imported."
              )

              print("2. Generating login page...")

              response = home()

              if response.status_code != 200:
                  raise RuntimeError(
                      "Login page returned "
                      f"status {response.status_code}."
                  )

              html = response.body.decode("utf-8")

              print(
                  "   SUCCESS: login page generated."
              )

              print("3. Checking login form...")

              required_text = [
                  'id="login-form"',
                  'id="email"',
                  'id="password"',
                  'id="login-button"',
                  "/auth/v1/token",
              ]

              for text in required_text:
                  if text not in html:
                      raise RuntimeError(
                          f"Missing login page element: "
                          f"{text}"
                      )

              print(
                  "   SUCCESS: login form is present."
              )

              print("4. Checking Supabase configuration...")

              if "__SUPABASE_URL__" in html:
                  raise RuntimeError(
                      "SUPABASE_URL placeholder "
                      "was not replaced."
                  )

              if "__SUPABASE_KEY__" in html:
                  raise RuntimeError(
                      "SUPABASE key placeholder "
                      "was not replaced."
                  )

              print(
                  "   SUCCESS: Supabase browser "
                  "configuration is injected."
              )

              print("5. Checking server secrets...")

              forbidden_text = [
                  "DATABASE_URL",
                  "REPORT_USER_ID",
                  "service_role",
                  "postgresql+psycopg2://",
              ]

              for text in forbidden_text:
                  if text in html:
                      raise RuntimeError(
                          "Server-only information "
                          f"appeared in HTML: {text}"
                      )

              print(
                  "   SUCCESS: server-only secrets "
                  "are not present in the page."
              )

              print("")
              print(
                  "SUCCESS: Supabase login page "
                  "is ready for authentication testing."
              )

          except Exception as exc:
              print("")
              print("ERROR: Login page test failed.")
              print(
                  f"{type(exc).__name__}: {exc}"
              )
              sys.exit(1)
          PY
