name: Test Supabase Connection

on:
  workflow_dispatch:

jobs:
  test-supabase:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REPORT_USER_ID: ${{ secrets.REPORT_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test report user scope
        run: |
          python - <<'PY'
          import os
          import sys
          from uuid import UUID

          from database.connection import init_db
          from database.repository import Repository

          try:
              print("1. Testing database connection...")
              init_db()
              print(
                  "   SUCCESS: database connection works."
              )

              user_id_text = os.environ.get(
                  "REPORT_USER_ID",
                  "",
              ).strip()

              if not user_id_text:
                  raise RuntimeError(
                      "REPORT_USER_ID secret is missing."
                  )

              user_id = UUID(user_id_text)

              print("2. Creating report Repository...")

              repo = Repository(
                  user_id=str(user_id)
              )

              print(
                  "   SUCCESS: user-scoped Repository created."
              )

              print("3. Reading report user's accounts...")

              accounts = repo.get_accounts()

              print(
                  f"   Accounts found: {len(accounts)}"
              )

              for account in accounts:
                  print(
                      "   - "
                      f"id={account.id}, "
                      f"name={account.account_name}"
                  )

              print("4. Reading investment profile...")

              profile = repo.get_investment_profile()

              if profile is None:
                  print(
                      "   Investment profile: not configured"
                  )
              else:
                  print(
                      "   Investment profile: configured"
                  )

              print("5. Reading watchlist...")

              watchlist = repo.get_watchlist()

              print(
                  f"   Watchlist items: {len(watchlist)}"
              )

              for item in watchlist:
                  print(
                      "   - "
                      f"{item['ticker']} "
                      f"{item['name']}"
                  )

              print("6. Reading user settings...")

              settings = repo.get_user_settings()

              if settings is None:
                  print(
                      "   User settings: not configured"
                  )
              else:
                  print(
                      "   User settings: configured"
                  )
                  print(
                      "   Morning report enabled: "
                      f"{settings.morning_report_enabled}"
                  )
                  print(
                      "   Morning report time: "
                      f"{settings.morning_report_time}"
                  )

              print("")
              print(
                  "SUCCESS: REPORT_USER_ID can read "
                  "user-scoped Supabase data."
              )

          except Exception as exc:
              print("")
              print(
                  "ERROR: Report user scope test failed."
              )
              print(
                  f"{type(exc).__name__}: {exc}"
              )
              sys.exit(1)
          PY
