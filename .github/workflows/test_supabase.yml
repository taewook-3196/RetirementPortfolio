name: Test Supabase Connection

on:
  workflow_dispatch:

jobs:
  test-supabase:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test project database layer
        run: |
          python - <<'PY'
          import sys

          from database.connection import init_db
          from database.repository import Repository

          try:
              print("1. Testing database.connection...")
              init_db()
              print("   SUCCESS: database.connection works.")

              print("2. Testing Repository...")
              repo = Repository()

              assets = repo.get_asset_master()

              print("   SUCCESS: Repository works.")
              print(f"   Shared assets found: {len(assets)}")

              print("")
              print("SUCCESS: Project database layer is connected to Supabase.")

          except Exception as exc:
              print("")
              print("ERROR: Project database layer test failed.")
              print(f"{type(exc).__name__}: {exc}")
              sys.exit(1)
          PY
