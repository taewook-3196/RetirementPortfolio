name: Test Supabase Connection

on:
  workflow_dispatch:

jobs:
  test-supabase:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_USER_ID: ${{ secrets.TEST_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test investment profile operations
        run: |
          python - <<'PY'
          import os
          import sys
          from uuid import UUID

          from database.connection import init_db
          from database.repository import Repository

          repo = None
          created = False

          try:
              print("1. Testing database connection...")
              init_db()
              print("   SUCCESS: database connection works.")

              user_id_text = os.environ.get(
                  "TEST_USER_ID",
                  "",
              ).strip()

              if not user_id_text:
                  raise RuntimeError(
                      "TEST_USER_ID secret is missing."
                  )

              user_id = UUID(user_id_text)

              print("2. Creating user-scoped Repository...")
              repo = Repository(
                  user_id=str(user_id)
              )
              print("   SUCCESS: Repository created.")

              # 이전 실패 테스트의 임시 데이터가 있다면 정리
              existing = repo.get_investment_profile()

              if existing is not None:
                  print(
                      "   Existing investment profile found."
                  )
                  print(
                      "   Removing it before the test."
                  )
                  repo.delete_investment_profile()

              print("3. Creating investment profile...")

              profile = repo.save_investment_profile(
                  risk_profile="balanced",
                  investment_horizon_years=15,
                  target_return=7.5,
                  max_drawdown=20.0,
                  monthly_investment=1000000,
                  preferred_markets=[
                      "KR",
                      "US",
                  ],
                  excluded_assets=[
                      "CRYPTO",
                  ],
                  ai_advice_enabled=True,
                  ai_advice_style="balanced",
                  memo="GitHub Actions test",
                  investment_preference_text=(
                      "장기 투자와 ETF 중심 투자를 선호합니다."
                  ),
              )

              created = True

              print(
                  "   SUCCESS: investment profile created."
              )
              print(
                  f"   Profile id: {profile.id}"
              )

              print("4. Reading investment profile...")

              saved = repo.get_investment_profile()

              if saved is None:
                  raise RuntimeError(
                      "Investment profile could not be read."
                  )

              if saved.risk_profile != "balanced":
                  raise RuntimeError(
                      "risk_profile was not saved correctly."
                  )

              if list(saved.preferred_markets or []) != [
                  "KR",
                  "US",
              ]:
                  raise RuntimeError(
                      "preferred_markets was not saved correctly."
                  )

              if (
                  saved.investment_preference_text
                  != "장기 투자와 ETF 중심 투자를 선호합니다."
              ):
                  raise RuntimeError(
                      "investment_preference_text "
                      "was not saved correctly."
                  )

              print(
                  "   SUCCESS: investment profile read."
              )

              print("5. Updating investment profile...")

              updated = repo.save_investment_profile(
                  risk_profile="growth",
                  investment_horizon_years=20,
                  target_return=9.0,
                  max_drawdown=25.0,
                  monthly_investment=1500000,
                  preferred_markets=[
                      "US",
                      "KR",
                  ],
                  excluded_assets=[],
                  ai_advice_enabled=True,
                  ai_advice_style="detailed",
                  memo="Updated GitHub Actions test",
                  investment_preference_text=(
                      "장기 투자하며 미국 시장 비중을 "
                      "높이고 ETF 중심으로 운용합니다."
                  ),
              )

              if updated.id != profile.id:
                  raise RuntimeError(
                      "Update created a second profile."
                  )

              check = repo.get_investment_profile()

              if check is None:
                  raise RuntimeError(
                      "Updated investment profile "
                      "could not be read."
                  )

              if check.risk_profile != "growth":
                  raise RuntimeError(
                      "Investment profile update failed."
                  )

              if float(check.monthly_investment) != 1500000:
                  raise RuntimeError(
                      "monthly_investment update failed."
                  )

              print(
                  "   SUCCESS: investment profile updated."
              )

              print("6. Deleting investment profile...")

              if not repo.delete_investment_profile():
                  raise RuntimeError(
                      "Investment profile deletion failed."
                  )

              created = False

              print(
                  "   SUCCESS: investment profile deleted."
              )

              print("7. Verifying deletion...")

              if repo.get_investment_profile() is not None:
                  raise RuntimeError(
                      "Investment profile still exists "
                      "after deletion."
                  )

              print(
                  "   SUCCESS: deletion verified."
              )

              print("")
              print(
                  "SUCCESS: User investment profile "
                  "operations are working with Supabase."
              )

          except Exception as exc:
              print("")
              print(
                  "ERROR: Investment profile test failed."
              )
              print(
                  f"{type(exc).__name__}: {exc}"
              )

              if created and repo is not None:
                  print(
                      "Attempting cleanup of temporary "
                      "investment profile..."
                  )

                  try:
                      if repo.delete_investment_profile():
                          print("Cleanup successful.")
                      else:
                          print(
                              "No temporary profile "
                              "was found."
                          )
                  except Exception as cleanup_exc:
                      print(
                          "Cleanup failed: "
                          f"{type(cleanup_exc).__name__}: "
                          f"{cleanup_exc}"
                      )

              sys.exit(1)
          PY
