name: Test Web Application

on:
  workflow_dispatch:

jobs:
  test-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test FastAPI application
        run: |
          python - <<'PY'
          import sys

          try:
              print("1. Importing FastAPI application...")

              from web.app import app

              print("   SUCCESS: web.app imported.")

              print("2. Checking application metadata...")

              if app.title != "RetirementPortfolio":
                  raise RuntimeError(
                      "Unexpected FastAPI application title."
                  )

              print(
                  "   SUCCESS: FastAPI application created."
              )

              print("3. Checking registered routes...")

              routes = {
                  route.path
                  for route in app.routes
              }

              if "/" not in routes:
                  raise RuntimeError(
                      "Home route '/' is missing."
                  )

              if "/health" not in routes:
                  raise RuntimeError(
                      "Health route '/health' is missing."
                  )

              print("   SUCCESS: required routes exist.")

              print("4. Testing /health response...")

              from web.app import health_check

              result = health_check()

              if result.get("status") != "ok":
                  raise RuntimeError(
                      "Health check did not return status=ok."
                  )

              print(
                  "   SUCCESS: /health response is valid."
              )

              print("")
              print(
                  "SUCCESS: FastAPI web application "
                  "is ready."
              )

          except Exception as exc:
              print("")
              print(
                  "ERROR: FastAPI web application "
                  "test failed."
              )
              print(
                  f"{type(exc).__name__}: {exc}"
              )
              sys.exit(1)
          PY
