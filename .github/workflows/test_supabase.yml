name: Test Web Authentication API

on:
  workflow_dispatch:

jobs:
  test-web-auth:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test authentication API
        run: |
          python - <<'PY'
          import asyncio
          import sys

          from fastapi import HTTPException

          try:
              print("1. Importing authentication API...")

              from web.app import app, get_current_user

              routes = {
                  route.path
                  for route in app.routes
              }

              if "/api/me" not in routes:
                  raise RuntimeError(
                      "/api/me route is missing."
                  )

              print(
                  "   SUCCESS: /api/me route exists."
              )

              print("2. Testing missing token...")

              try:
                  get_current_user(
                      authorization=None
                  )
                  raise RuntimeError(
                      "Missing token was accepted."
                  )

              except HTTPException as exc:
                  if exc.status_code != 401:
                      raise

              print(
                  "   SUCCESS: missing token rejected."
              )

              print("3. Testing malformed token...")

              try:
                  get_current_user(
                      authorization="not-a-bearer-token"
                  )
                  raise RuntimeError(
                      "Malformed token was accepted."
                  )

              except HTTPException as exc:
                  if exc.status_code != 401:
                      raise

              print(
                  "   SUCCESS: malformed token rejected."
              )

              print("4. Testing fake Bearer token...")

              try:
                  get_current_user(
                      authorization=(
                          "Bearer "
                          "this-is-not-a-valid-token"
                      )
                  )

                  raise RuntimeError(
                      "Fake token was accepted."
                  )

              except HTTPException as exc:
                  if exc.status_code != 401:
                      raise

              print(
                  "   SUCCESS: fake token rejected."
              )

              print("")
              print(
                  "SUCCESS: Authentication API rejects "
                  "unauthenticated requests."
              )

          except Exception as exc:
              print("")
              print(
                  "ERROR: Authentication API "
                  "test failed."
              )
              print(
                  f"{type(exc).__name__}: {exc}"
              )
              sys.exit(1)
          PY
