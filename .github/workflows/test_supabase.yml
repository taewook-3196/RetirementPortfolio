name: Test Supabase Web Configuration

on:
  workflow_dispatch:

jobs:
  test-web-config:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Supabase web configuration
        run: |
          python - <<'PY'
          import os
          import sys

          try:
              print("1. Checking SUPABASE_URL...")

              url = os.environ.get(
                  "SUPABASE_URL",
                  "",
              ).strip()

              if not url:
                  raise RuntimeError(
                      "SUPABASE_URL is missing."
                  )

              if not (
                  url.startswith("https://")
                  and url.endswith(".supabase.co")
              ):
                  raise RuntimeError(
                      "SUPABASE_URL has an unexpected format."
                  )

              print(
                  "   SUCCESS: SUPABASE_URL is configured."
              )

              print("2. Checking browser API key...")

              api_key = os.environ.get(
                  "SUPABASE_ANON_KEY",
                  "",
              ).strip()

              if not api_key:
                  raise RuntimeError(
                      "SUPABASE_ANON_KEY is missing."
                  )

              if not (
                  api_key.startswith("eyJ")
                  or api_key.startswith("sb_publishable_")
              ):
                  raise RuntimeError(
                      "SUPABASE_ANON_KEY has an "
                      "unexpected format."
                  )

              print(
                  "   SUCCESS: browser API key "
                  "is configured."
              )

              print("")
              print(
                  "SUCCESS: Supabase web "
                  "configuration is ready."
              )

          except Exception as exc:
              print("")
              print(
                  "ERROR: Supabase web "
                  "configuration test failed."
              )
              print(
                  f"{type(exc).__name__}: {exc}"
              )
              sys.exit(1)
          PY
