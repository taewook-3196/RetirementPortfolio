name: Test Supabase Connection

on:
  workflow_dispatch:

jobs:
  test-supabase:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test project database layer
        run: |
          python - <<'PY'
          import sys

          from database.connection import init_db
          from database.repository import Repository

          try:
              print("1. Testing database.connection...")
              init_db()
              print("   SUCCESS: database.connection works.")

              print("2. Creating Repository...")
              repo = Repository()
              print("   SUCCESS: Repository created.")

              print("3. Reading asset_master...")
              assets = repo.search_etf_master(
                  keyword="",
                  limit=10,
              )

              print("   SUCCESS: asset_master query works.")
              print(f"   Assets found: {len(assets)}")

              for asset in assets:
                  print(
                      "   -",
                      asset["ticker"],
                      asset["name"],
                      asset["market"],
                  )

              print("")
              print(
                  "SUCCESS: Project database layer "
                  "is working with Supabase."
              )

          except Exception as exc:
              print("")
              print(
                  "ERROR: Project database layer "
                  "test failed."
              )
              print(
                  f"{type(exc).__name__}: {exc}"
              )
              sys.exit(1)
          PY
