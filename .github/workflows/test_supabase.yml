name: Test Supabase Connection

on:
  workflow_dispatch:

jobs:
  test-supabase:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database dependencies
        run: |
          python -m pip install --upgrade pip
          pip install SQLAlchemy psycopg2-binary

      - name: Test Supabase PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          import sys

          from sqlalchemy import create_engine, text

          database_url = os.getenv("DATABASE_URL")

          if not database_url:
              print("ERROR: DATABASE_URL secret is not available.")
              sys.exit(1)

          print("DATABASE_URL secret: found")
          print("Connecting to Supabase PostgreSQL...")

          try:
              engine = create_engine(
                  database_url,
                  pool_pre_ping=True,
              )

              with engine.connect() as connection:
                  result = connection.execute(
                      text(
                          """
                          SELECT
                              current_database() AS database_name,
                              COUNT(*) AS account_count
                          FROM public.accounts
                          """
                      )
                  ).mappings().one()

                  print("SUCCESS: Supabase connection established.")
                  print(
                      "Database:",
                      result["database_name"],
                  )
                  print(
                      "Accounts:",
                      result["account_count"],
                  )

              engine.dispose()

          except Exception as exc:
              print("ERROR: Supabase connection failed.")
              print(
                  f"{type(exc).__name__}: {exc}"
              )
              sys.exit(1)
          PY
