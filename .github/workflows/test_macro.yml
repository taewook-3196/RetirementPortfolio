name: Test Macro Indicators

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test BEA connection
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://www.bea.gov/data/personal-consumption-expenditures-price-index-excluding-food-and-energy"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
          )

          try:
              with urllib.request.urlopen(
                  req,
                  timeout=15,
              ) as response:
                  body = response.read().decode(
                      "utf-8",
                      errors="ignore",
                  )

              print("BEA STATUS: OK")
              print("HTTP:", response.status)
              print("SIZE:", len(body))
              print(
                  "HAS CORE PCE:",
                  "July 2026" in body
                  or "PCE" in body,
              )

          except Exception as e:
              print("BEA STATUS: FAILED")
              print("ERROR:", repr(e))
              raise
          PY

      - name: Test macro indicators
        run: |
          python - <<'PY'
          from services.macro_indicator_service import MacroIndicatorService

          service = MacroIndicatorService()
          data = service.fetch_all_macro_data()

          print("\n=== OFFICIAL US ECONOMIC INDICATORS ===")

          fundamentals = data.get("fundamentals", {})

          for key in [
              "core_pce",
              "jobs_nfp",
              "unemployment_rate",
          ]:
              item = fundamentals.get(key, {})

              print(f"\n[{key}]")
              print("success       :", item.get("success"))
              print("latest_value  :", item.get("latest_value"))
              print("previous_value:", item.get("previous_value"))
              print("change_text   :", item.get("change_text"))
              print("trend_badge   :", item.get("trend_badge"))
              print("period        :", item.get("period"))
              print("source        :", item.get("source"))

          print("\n=== GEMINI INPUT ===")
          print(service.build_summary_for_gemini(data))

          print("\n=== KAKAO INPUT ===")
          for line in service.build_kakao_macro_lines(data):
              print(line)
          PY
