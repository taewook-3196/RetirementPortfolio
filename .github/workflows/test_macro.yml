name: Test Macro Indicators

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test BEA API
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_key = os.environ["BEA_API_KEY"]

          params = {
              "UserID": api_key,
              "method": "GetData",
              "datasetname": "NIPA",
              "TableName": "T20804",
              "Frequency": "M",
              "Year": "X",
              "ResultFormat": "JSON",
          }

          url = (
              "https://apps.bea.gov/api/data/?"
              + urllib.parse.urlencode(params)
          )

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "RetirementPortfolio/1.0"},
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          bea = result.get("BEAAPI", {})

          if bea.get("Error"):
              raise RuntimeError(
                  f"BEA API ERROR: {bea['Error']}"
              )

          results = bea.get("Results", {})
          data = results.get("Data", [])

          print("BEA API STATUS: OK")
          print("ROWS:", len(data))

          core_rows = []

          for row in data:
              line_description = str(
                  row.get("LineDescription", "")
              )

              if "excluding food and energy" in line_description.lower():
                  core_rows.append(row)

          print("CORE PCE ROWS:", len(core_rows))

          for row in core_rows[-5:]:
              print(
                  row.get("TimePeriod"),
                  row.get("LineDescription"),
                  row.get("DataValue"),
              )
          PY

      - name: Test macro indicators
        run: |
          python - <<'PY'
          from services.macro_indicator_service import MacroIndicatorService

          service = MacroIndicatorService()
          data = service.fetch_all_macro_data()

          print("\n=== OFFICIAL US ECONOMIC INDICATORS ===")

          fundamentals = data.get("fundamentals", {})

          for key in [
              "core_pce",
              "jobs_nfp",
              "unemployment_rate",
          ]:
              item = fundamentals.get(key, {})

              print(f"\n[{key}]")
              print("success       :", item.get("success"))
              print("latest_value  :", item.get("latest_value"))
              print("previous_value:", item.get("previous_value"))
              print("change_text   :", item.get("change_text"))
              print("trend_badge   :", item.get("trend_badge"))
              print("period        :", item.get("period"))
              print("source        :", item.get("source"))

          print("\n=== GEMINI INPUT ===")
          print(service.build_summary_for_gemini(data))

          print("\n=== KAKAO INPUT ===")
          for line in service.build_kakao_macro_lines(data):
              print(line)
          PY
