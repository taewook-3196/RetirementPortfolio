name: Test Macro Indicators

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find BEA Core PCE table
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_key = os.environ["BEA_API_KEY"]

          params = {
              "UserID": api_key,
              "method": "GetParameterValues",
              "datasetname": "NIPA",
              "ParameterName": "TableName",
              "ResultFormat": "JSON",
          }

          url = (
              "https://apps.bea.gov/api/data/?"
              + urllib.parse.urlencode(params)
          )

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "RetirementPortfolio/1.0"
              },
          )

          with urllib.request.urlopen(
              req,
              timeout=30,
          ) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          bea = result.get("BEAAPI", {})

          if bea.get("Error"):
              raise RuntimeError(
                  f"BEA API ERROR: {bea['Error']}"
              )

          values = (
              bea
              .get("Results", {})
              .get("ParamValue", [])
          )

          print("BEA TABLE COUNT:", len(values))
          print("=== PCE / PRICE CANDIDATES ===")

          matches = []

          for item in values:
              description = str(
                  item.get(
                      "Description",
                      "",
                  )
              )

              table_name = str(
                  item.get(
                      "TableName",
                      item.get("Key", ""),
                  )
              )

              text = (
                  table_name
                  + " "
                  + description
              ).lower()

              if (
                  "personal consumption" in text
                  or "pce" in text
              ):
                  matches.append(
                      (
                          table_name,
                          description,
                      )
                  )

          print("MATCHES:", len(matches))

          for table_name, description in matches:
              print(
                  table_name,
                  "|",
                  description,
              )
          PY
      - name: Test macro indicators
        run: |
          python - <<'PY'
          from services.macro_indicator_service import MacroIndicatorService

          service = MacroIndicatorService()
          data = service.fetch_all_macro_data()

          print("\n=== OFFICIAL US ECONOMIC INDICATORS ===")

          fundamentals = data.get("fundamentals", {})

          for key in [
              "core_pce",
              "jobs_nfp",
              "unemployment_rate",
          ]:
              item = fundamentals.get(key, {})

              print(f"\n[{key}]")
              print("success       :", item.get("success"))
              print("latest_value  :", item.get("latest_value"))
              print("previous_value:", item.get("previous_value"))
              print("change_text   :", item.get("change_text"))
              print("trend_badge   :", item.get("trend_badge"))
              print("period        :", item.get("period"))
              print("source        :", item.get("source"))

          print("\n=== GEMINI INPUT ===")
          print(service.build_summary_for_gemini(data))

          print("\n=== KAKAO INPUT ===")
          for line in service.build_kakao_macro_lines(data):
              print(line)
          PY
