name: Kakao Delivery PostgreSQL Tests

on:
  pull_request:
    paths:
      - 'database/migrations/20261012_kakao_delivery_attempts.sql'
      - 'database/migrations/20261014_kakao_delivery_recovery_audit.sql'
      - 'tests/test_kakao_delivery_postgres.py'
      - 'services/kakao_delivery_*.py'
      - 'tests/test_kakao_delivery_*.py'
      - '.github/workflows/kakao_delivery_postgres_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: kakao_delivery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest psycopg2-binary
      - name: Compile staged Kakao delivery modules and tests
        run: |
          python -m compileall -q services/kakao_delivery_*.py tests/test_kakao_delivery_*.py
      - name: Test atomic claim and completion against disposable PostgreSQL
        env:
          KAKAO_DELIVERY_TEST_DSN: postgresql+psycopg2://testuser:testpassword@localhost:5432/kakao_delivery_ci
        run: python -m pytest -q tests/test_kakao_delivery_postgres.py tests/test_kakao_delivery_recovery_audit_postgres.py tests/test_kakao_delivery_recovery_audit_writer_postgres.py
