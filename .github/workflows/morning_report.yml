name: Morning Portfolio Report & KakaoTalk Notification

on:
  # KST Tue-Sat only. UTC Mon-Fri evening = next-day KST Tue-Sat morning.
  # 20:35 UTC=05:35 KST next day; 22:10 UTC=07:10 KST next day.
  # 00:00 UTC=09:00 KST same day (backup).
  # GitHub scheduled runs can be delayed or skipped; the backup retries missing reports.
  schedule:
    - cron: '35 20 * * 1-5'
    - cron: '10 22 * * 1-5'
    - cron: '0 0 * * 2-6'
  # GitHub API 또는 데스크톱 앱에서 원격 수동 즉시 실행 지원
  workflow_dispatch:
    inputs:
      force_resend:
        description: '오늘 리포트를 강제로 다시 생성·카카오 재발송'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "morning-report"
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Seoul'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      REPORT_OUTPUT_DIR: /tmp/morning-report
      FORCE_MORNING_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_resend && 'true' || 'false' }}
      
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
     
      - name: 실행 버전 확인
        run: |
          echo "REPORT_CODE_SHA=$(git rev-parse HEAD)"
          git log -1 --oneline

      - name: 사용자별 모닝 리포트 생성 및 DB 저장
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          AI_INVESTMENT_STANCE: ${{ vars.AI_INVESTMENT_STANCE || '' }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.OAUTH_TOKEN_ENCRYPTION_KEY }}
        run: |
          python -m scripts.run_multi_user_morning_reports
