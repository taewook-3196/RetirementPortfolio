name: Morning Portfolio Report & KakaoTalk Notification

on:
  # 매일 한국시간 05:34 (UTC 20:34) 정기 실행
  schedule:
    - cron: '34 20 * * *'
  # GitHub API 또는 데스크톱 앱에서 원격 수동 즉시 실행 지원
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "morning-report"
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Seoul'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REPORT_USER_ID: ${{ secrets.REPORT_USER_ID }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      RETIREMENT_PORTFOLIO_WEB_URL: ${{ vars.RETIREMENT_PORTFOLIO_WEB_URL || 'https://retirementportfolio.onrender.com/' }}
      RETIREMENT_PORTFOLIO_REPORT_URL: ${{ vars.RETIREMENT_PORTFOLIO_REPORT_URL || 'https://retirementportfolio.onrender.com/?view=report' }}
      REPORT_OUTPUT_DIR: ${{ runner.temp }}/morning-report
      
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
     
      - name: 모닝 리포트 HTML 생성 및 데이터 분석
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          AI_INVESTMENT_STANCE: ${{ vars.AI_INVESTMENT_STANCE || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m services.daily_report_service --generate-only

      - name: 카카오톡 알림 발송 (DB 저장 완료 후)
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          python -m services.daily_report_service --send-kakao-only
