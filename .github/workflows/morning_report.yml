name: Morning Portfolio Report & KakaoTalk Notification

on:
  # 매일 한국시간 05:34 (UTC 20:34) 정기 실행
  schedule:
    - cron: '34 20 * * *'
  # GitHub API 또는 데스크톱 앱에서 원격 수동 즉시 실행 지원
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "morning-report"
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Seoul'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      RETIREMENT_PORTFOLIO_WEB_URL: ${{ vars.RETIREMENT_PORTFOLIO_WEB_URL || 'https://retirementportfolio.onrender.com/' }}
      RETIREMENT_PORTFOLIO_REPORT_URL: ${{ vars.RETIREMENT_PORTFOLIO_REPORT_URL || 'https://retirementportfolio.onrender.com/?view=report' }}
      REPORT_OUTPUT_DIR: /tmp/morning-report
      
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
     
      - name: 사용자별 모닝 리포트 생성 및 DB 저장
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          AI_INVESTMENT_STANCE: ${{ vars.AI_INVESTMENT_STANCE || '' }}
        run: |
          python -m scripts.run_multi_user_morning_reports
