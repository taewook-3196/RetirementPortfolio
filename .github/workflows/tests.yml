name: Python Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        env:
          # Non-production test-only value. Tests that instantiate the Kakao
          # service need an encryption secret, but never use real OAuth tokens.
          OAUTH_TOKEN_ENCRYPTION_KEY: ci-test-only-encryption-key
        run: pytest -q
